<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Sin Gluten | Iniciar sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f8f2;
            color: #333;
        }

        header {
            background-color: #315c43;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 460px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .pestanas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 25px;
            border-bottom: 2px solid #e6eddf;
        }

        .pestana {
            background: none;
            border: none;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            color: #777;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .pestana.activa {
            color: #315c43;
            font-weight: bold;
            border-bottom-color: #315c43;
        }

        .formulario {
            display: none;
        }

        .formulario.activo {
            display: block;
        }

        .formulario h2 {
            font-size: 22px;
            color: #315c43;
            margin-bottom: 18px;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .campo input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }


        .contrasena-contenedor {
            position: relative;
        }

        .contrasena-contenedor input {
            padding-right: 40px;
        }

        .boton-ojo {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
            color: #315c43;
            padding: 3px;
            touch-action: none;
        }


        .campo input.invalido {
            border-color: #c0392b;
            background-color: #fbe9e7;
        }

        .error-campo {
            display: block;
            color: #c0392b;
            font-size: 13px;
            margin-top: 5px;
            min-height: 0;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .boton {
            background-color: #315c43;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        .mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }

        .mensaje.error {
            display: block;
            background-color: #fbe9e7;
            color: #c0392b;
        }

        .mensaje.exito {
            display: block;
            background-color: #e6eddf;
            color: #315c43;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .fila {
                grid-template-columns: 1fr;
            }
        }


        /* ===== ANIMACIONES DE REGISTRO ===== */

        button,
        .boton,
        input[type="submit"] {
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover,
        .boton:hover,
        input[type="submit"]:hover {
            transform: scale(1.025);
            filter: brightness(1.08);
        }

        button:active,
        .boton:active,
        input[type="submit"]:active {
            transform: scale(0.98);
        }

        @media (prefers-reduced-motion: reduce) {
            button,
            .boton,
            input[type="submit"] {
                transition: none;
            }
        }

        /* ===== TEMA OSCURO ===== */

        body.tema-oscuro {
            background-color: #151915;
            color: #e8eee8;
        }

        .tema-oscuro header {
            background-color: #1d3829;
            color: #ffffff;
        }

        .tema-oscuro .card {
            background-color: #222922;
            color: #e8eee8;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .25);
        }

        .tema-oscuro h2,
        .tema-oscuro .formulario h2,
        .tema-oscuro .total {
            color: #a9d5b2;
        }

        .tema-oscuro .pestanas {
            border-bottom-color: #3b493d;
        }

        .tema-oscuro .pestana {
            color: #b9c4ba;
        }

        .tema-oscuro .pestana.activa {
            color: #a9d5b2;
            border-bottom-color: #a9d5b2;
        }

        .tema-oscuro input:not([type="checkbox"]):not([type="radio"]) {
            background-color: #171d18;
            color: #f1f5f1;
            border-color: #4b594d;
        }

        .tema-oscuro input::placeholder {
            color: #a0aaa1;
        }

        .tema-oscuro .boton-ojo {
            color: #a9d5b2;
        }

        .tema-oscuro .item {
            border-bottom-color: #3a443b;
        }

        .tema-oscuro .metodo {
            border-color: #48574a;
            background-color: #252e26;
            color: #e8eee8;
        }

        .tema-oscuro .metodo.activo {
            border-color: #8cbd97;
            background-color: #304936;
        }

        .tema-oscuro .panel {
            background-color: #1a211b;
            color: #e8eee8;
        }

        .tema-oscuro .mensaje.exito {
            background-color: #263e2b;
            color: #bce5c3;
        }

        .tema-oscuro .mensaje.error,
        .tema-oscuro .campo input.invalido {
            background-color: #3b2422;
            color: #ffb9b2;
        }

        .tema-oscuro .campo input.invalido {
            border-color: #e16b61;
        }

        .tema-oscuro a {
            color: #a9d5b2;
        }

        .tema-oscuro .error,
        .tema-oscuro .error-campo {
            color: #ffaaa3;
        }

        .tema-oscuro .boton {
            background-color: #477b55;
            color: #ffffff;
        }

        .tema-oscuro .boton:disabled {
            background-color: #555d56;
        }

        .tema-oscuro .boton-ojo:hover,
        .tema-oscuro .pestana:hover {
            filter: brightness(1.2);
        }

        .boton-tema {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px;
            color: #ffffff;
            background: transparent;
            border: 1px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
        }

        .boton-tema svg {
            width: 22px;
            height: 22px;
        }

        .acciones-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .acciones-header {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* Tema oscuro */
        body.tema-oscuro {
            background-color: #151915;
            color: #e8eee8;
        }

        body.tema-oscuro header {
            background-color: #1d3829;
            color: white;
        }

        body.tema-oscuro .card {
            background-color: #222922;
            color: #e8eee8;
        }

        body.tema-oscuro input {
            background-color: #171d18;
            color: white;
            border-color: #4b594d;
        }
    </style>
</head>

<body>
    <header>
        <h1>Tienda Sin Gluten</h1>
    </header>

    <main>
        <div class="card">

            <div class="pestanas">
                <button class="pestana activa" data-form="login">Iniciar sesión</button>
                <button class="pestana" data-form="registro">Registrarse</button>
            </div>

            <!-- INICIAR SESIÓN -->
            <form class="formulario activo" id="form-login" novalidate>
                <h2>Iniciar sesión</h2>

                <div class="campo">
                    <label for="login-telefono">Número de teléfono</label>
                    <input type="tel" id="login-telefono" placeholder="0981234567" maxlength="10" inputmode="numeric">
                    <small class="error-campo" id="err-login-telefono"></small>
                </div>

                <div class="campo">
                    <label for="login-contrasena">Contraseña</label>
                    <div class="contrasena-contenedor">
                        <input type="password" id="login-contrasena" autocomplete="current-password">
                        <button type="button" class="boton-ojo" aria-label="Mantener presionado para ver la contraseña">👁</button>
                    </div>
                    <small class="error-campo" id="err-login-contrasena"></small>
                </div>

                <button type="submit" class="boton">Ingresar</button>
                <div class="mensaje" id="mensaje-login"></div>
            </form>

            <!-- REGISTRO -->
            <form class="formulario" id="form-registro" novalidate>
                <h2>Crear cuenta</h2>

                <div class="fila">
                    <div class="campo">
                        <label for="reg-nombre">Nombre</label>
                        <input type="text" id="reg-nombre" autocomplete="given-name">
                        <small class="error-campo" id="err-reg-nombre"></small>
                    </div>
                    <div class="campo">
                        <label for="reg-apellido">Apellido</label>
                        <input type="text" id="reg-apellido" autocomplete="family-name">
                        <small class="error-campo" id="err-reg-apellido"></small>
                    </div>
                </div>

                <div class="campo">
                    <label for="reg-direccion">Dirección</label>
                    <input type="text" id="reg-direccion" autocomplete="street-address">
                    <small class="error-campo" id="err-reg-direccion"></small>
                </div>

                <div class="campo">
                    <label for="reg-telefono">Número de teléfono</label>
                    <input type="tel" id="reg-telefono" placeholder="0981234567" maxlength="10" inputmode="numeric">
                    <small class="error-campo" id="err-reg-telefono"></small>
                </div>

                <div class="campo">
                    <label for="reg-ruc">RUC (opcional)</label>
                    <input type="text" id="reg-ruc" placeholder="80012345-6" maxlength="15">
                    <small class="error-campo" id="err-reg-ruc"></small>
                </div>

                <div class="fila">
                    <div class="campo">
                        <label for="reg-contrasena">Contraseña</label>
                        <div class="contrasena-contenedor">
                            <input type="password" id="reg-contrasena" autocomplete="new-password">
                            <button type="button" class="boton-ojo" aria-label="Mantener presionado para ver la contraseña">👁</button>
                        </div>
                        <small class="error-campo" id="err-reg-contrasena"></small>
                    </div>
                    <div class="campo">
                        <label for="reg-confirmar">Confirmar contraseña</label>
                        <div class="contrasena-contenedor">
                            <input type="password" id="reg-confirmar" autocomplete="new-password">
                            <button type="button" class="boton-ojo" aria-label="Mantener presionado para ver la contraseña">👁</button>
                        </div>
                        <small class="error-campo" id="err-reg-confirmar"></small>
                    </div>
                </div>

                <button type="submit" class="boton">Registrarme</button>
                <div class="mensaje" id="mensaje-registro"></div>
            </form>

        </div>
    </main>

    <script>

        // Aplicar el tema elegido en inicio.html
        const temaGuardado = localStorage.getItem('tema-oscuro') === 'true';

        document.body.classList.toggle('tema-oscuro', temaGuardado);

        const pestanas = document.querySelectorAll('.pestana');
        const formularios = document.querySelectorAll('.formulario');

        const loginTelefono = document.getElementById('login-telefono');
        const loginContrasena = document.getElementById('login-contrasena');
        const regNombre = document.getElementById('reg-nombre');
        const regApellido = document.getElementById('reg-apellido');
        const regDireccion = document.getElementById('reg-direccion');
        const regTelefono = document.getElementById('reg-telefono');
        const regRuc = document.getElementById('reg-ruc');
        const regContrasena = document.getElementById('reg-contrasena');
        const regConfirmar = document.getElementById('reg-confirmar');

        // Cambiar entre iniciar sesión y registrarse
        pestanas.forEach(pestana => {
            pestana.addEventListener('click', () => {
                pestanas.forEach(p => p.classList.remove('activa'));
                formularios.forEach(f => f.classList.remove('activo'));

                pestana.classList.add('activa');
                document.getElementById('form-' + pestana.dataset.form).classList.add('activo');
            });
        });

        // Al volver a escribir en un campo, se quita su error
        document.querySelectorAll('.campo input').forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('invalido');
                document.getElementById('err-' + input.id).textContent = '';
            });
        });

        function mostrarMensaje(id, texto, tipo) {
            const caja = document.getElementById(id);
            caja.textContent = texto;
            caja.className = 'mensaje ' + tipo;
        }

        function limpiarErrores(idFormulario) {
            document.querySelectorAll('#' + idFormulario + ' .error-campo').forEach(e => e.textContent = '');
            document.querySelectorAll('#' + idFormulario + ' .invalido').forEach(i => i.classList.remove('invalido'));
        }

        function obtenerUsuarios() {
            return JSON.parse(localStorage.getItem('usuarios')) || [];
        }

        // Ir a la página de pago después de iniciar sesión o registrarse
        
        function finalizarAutenticacion() {
            if (window.parent !== window) {
                const modal = window.parent.document.getElementById('modal-autenticacion');
                const origen = modal.dataset.origen;

                window.parent.cerrarAutenticacion();

                if (origen === 'pago') {
                    window.parent.location.href = '/pago';
                } else {
                    window.parent.location.href = '/';
                }
            } else {
                window.location.href = '/';
            }
        }


        // Revisa las reglas y muestra el primer error de cada campo debajo de él.
        // Devuelve true si todo está bien.
        function validar(reglas) {
            let todoBien = true;
            const yaMarcados = new Set();

            reglas.forEach(regla => {
                if (yaMarcados.has(regla.input)) return;

                if (!regla.valido()) {
                    yaMarcados.add(regla.input);
                    regla.input.classList.add('invalido');
                    document.getElementById('err-' + regla.input.id).textContent = regla.mensaje;
                    todoBien = false;
                }
            });

            return todoBien;
        }

        // Registro
        document.getElementById('form-registro').addEventListener('submit', async e => {
            e.preventDefault();
            limpiarErrores('form-registro');

            const v = {
                nombre: regNombre.value.trim(),
                apellido: regApellido.value.trim(),
                direccion: regDireccion.value.trim(),
                telefono: regTelefono.value.trim(),
                ruc: regRuc.value.trim(),
                contrasena: regContrasena.value,
                confirmar: regConfirmar.value
            };

            const reglas = [
                // Campos en blanco
                { input: regNombre, valido: () => v.nombre !== '', mensaje: 'Este campo es obligatorio.' },
                { input: regApellido, valido: () => v.apellido !== '', mensaje: 'Este campo es obligatorio.' },
                { input: regDireccion, valido: () => v.direccion !== '', mensaje: 'Este campo es obligatorio.' },
                { input: regTelefono, valido: () => v.telefono !== '', mensaje: 'Este campo es obligatorio.' },
                { input: regContrasena, valido: () => v.contrasena !== '', mensaje: 'Este campo es obligatorio.' },
                { input: regConfirmar, valido: () => v.confirmar !== '', mensaje: 'Este campo es obligatorio.' },

                // Formato
                {
                    input: regTelefono,
                    valido: () => /^0\d{9}$/.test(v.telefono),
                    mensaje: 'Debe tener 10 números y empezar por 0, sin espacios.'
                },
                {
                    input: regContrasena,
                    valido: () => v.contrasena.length >= 8
                        && !/\s/.test(v.contrasena)
                        && /\d/.test(v.contrasena)
                        && /[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(v.contrasena),
                    mensaje: 'Mínimo 8 caracteres, sin espacios, con al menos una letra y un número.'
                },
                {
                    input: regConfirmar,
                    valido: () => v.confirmar === v.contrasena,
                    mensaje: 'Las contraseñas no coinciden.'
                },
                {
                    input: regRuc,
                    valido: () => v.ruc === '' || /^\d{5,8}-?\d?$/.test(v.ruc),
                    mensaje: 'El RUC debe contener solo números, con guion opcional antes del dígito verificador.'
                },
            ];

            if (!validar(reglas)) return;

            let datos, respuesta;

            try {
                respuesta = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(v)
                });
                datos = await respuesta.json();
            } catch (error) {
                return mostrarMensaje('mensaje-registro', 'No se pudo conectar con el servidor.', 'error');
            }

            if (!respuesta.ok) {
                const campo = document.getElementById(datos.campo);
                const caja = document.getElementById('err-' + datos.campo);

                if (campo && caja) {
                    campo.classList.add('invalido');
                    caja.textContent = datos.error;
                } else {
                    mostrarMensaje('mensaje-registro', datos.error, 'error');
                }
                return;
            }

            mostrarMensaje('mensaje-registro', '¡Cuenta creada! Bienvenido, ' + datos.nombre + '.', 'exito');
            setTimeout(() => {
                finalizarAutenticacion();
            }, 1000);

            e.target.reset();
        });

        // Iniciar sesión
        document.getElementById('form-login').addEventListener('submit', async e => {
            e.preventDefault();
            limpiarErrores('form-login');

            const v = {
                telefono: loginTelefono.value.trim(),
                contrasena: loginContrasena.value
            };

            const reglas = [
                { input: loginTelefono, valido: () => v.telefono !== '', mensaje: 'Este campo es obligatorio.' },
                { input: loginContrasena, valido: () => v.contrasena !== '', mensaje: 'Este campo es obligatorio.' },
                {
                    input: loginTelefono,
                    valido: () => /^0\d{9}$/.test(v.telefono),
                    mensaje: 'Debe tener 10 números y empezar por 0, sin espacios.'
                }
            ];

            if (!validar(reglas)) return;

            let datos, respuesta;

            try {
                respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(v)
                });
                datos = await respuesta.json();
            } catch (error) {
                return mostrarMensaje('mensaje-login', 'No se pudo conectar con el servidor.', 'error');
            }

            if (!respuesta.ok) {
                loginTelefono.classList.add('invalido');
                loginContrasena.classList.add('invalido');
                return mostrarMensaje('mensaje-login', datos.error, 'error');
            }

            mostrarMensaje('mensaje-login', 'Bienvenido, ' + datos.nombre + '.', 'exito');

            setTimeout(() => {
                finalizarAutenticacion();
            }, 1000);
            e.target.reset();
        });

        document.querySelectorAll('.boton-ojo').forEach(boton => {
            const campo = boton.parentElement.querySelector('input');

            boton.addEventListener('pointerdown', e => {
                e.preventDefault();
                campo.type = 'text';
            });

            function ocultarContrasena() {
                campo.type = 'password';
            }

            boton.addEventListener('pointerup', ocultarContrasena);
            boton.addEventListener('pointerleave', ocultarContrasena);
            boton.addEventListener('pointercancel', ocultarContrasena);

            window.addEventListener('pointerup', ocultarContrasena);
        });

        function aplicarTema(oscuro) {
            document.body.classList.toggle('tema-oscuro', oscuro);

            const boton = document.getElementById('btn-tema');
            const icono = document.getElementById('icono-tema');

            if (boton && icono) {
                boton.setAttribute(
                    'aria-label',
                    oscuro ? 'Activar modo claro' : 'Activar modo oscuro'
                );

                icono.innerHTML = oscuro
                    ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>'
                    : '<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"></path>';
            }
        }

        const temaInicial = localStorage.getItem('tema-oscuro') === 'true';
        aplicarTema(localStorage.getItem('tema-oscuro') === 'true');

        window.addEventListener('storage', function (evento) {
            if (evento.key === 'tema-oscuro') {
                aplicarTema(evento.newValue === 'true');
            }
        });

        document.getElementById('btn-tema').addEventListener('click', () => {
            const oscuro = !document.body.classList.contains('tema-oscuro');

            localStorage.setItem('tema-oscuro', oscuro);
            aplicarTema(oscuro);
        });
    </script>

</body>
</html>
